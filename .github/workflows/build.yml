name: Build PlatformIO Firmware

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        environment:
          - esp32-c3-supermini
          - esp32-c3
          - esp32-c3-zero
          - nuclearcounter
          - esp32-c6
          - esp32dev
          - esp32dev-2mb
          - esp32-s3
          - esp32-s3-t-energy
          - esp32-s2

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-${{ matrix.environment }}-
          ${{ runner.os }}-pio-

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        pio --version

    - name: Build firmware for ${{ matrix.environment }}
      run: pio run -e ${{ matrix.environment }}

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts/${{ matrix.environment }}
        cp .pio/build/${{ matrix.environment }}/firmware.bin artifacts/${{ matrix.environment }}/
        cp .pio/build/${{ matrix.environment }}/bootloader.bin artifacts/${{ matrix.environment }}/
        cp .pio/build/${{ matrix.environment }}/partitions.bin artifacts/${{ matrix.environment }}/

        case "${{ matrix.environment }}" in
          esp32dev|esp32dev-2mb|esp32-s2) BOOT=0x1000 ;;
          *) BOOT=0x0 ;;
        esac
        cat > artifacts/${{ matrix.environment }}/FLASH_INSTRUCTIONS.txt << EOF
        StarForge Legacy firmware - ${{ matrix.environment }}
        ========================================

        Flash using esptool.py:
        -----------------------
        esptool.py --chip auto --port /dev/ttyUSB0 --baud 921600 write_flash \\
          ${BOOT} bootloader.bin \\
          0x8000 partitions.bin \\
          0x10000 firmware.bin

        Or use PlatformIO:
        ------------------
        pio run -e ${{ matrix.environment }} --target upload --upload-port /dev/ttyUSB0

        Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)
        Commit: ${{ github.sha }}
        EOF

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.environment }}
        path: artifacts/${{ matrix.environment }}

    - name: Firmware size
      run: pio run -e ${{ matrix.environment }} --target size

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-firmware

    - name: Create release packages
      run: |
        cd all-firmware
        for env in esp32-c3-supermini esp32-c3 esp32-c3-zero nuclearcounter esp32-c6 esp32dev esp32dev-2mb esp32-s3 esp32-s3-t-energy esp32-s2; do
          if [ -d "firmware-$env" ]; then
            (cd "firmware-$env" && zip -r "../StarForge-${env}.zip" .)
          fi
        done
        ls -lh

    - name: Upload to release
      uses: softprops/action-gh-release@v1
      with:
        files: all-firmware/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Build summary
      run: |
        echo "### Build results" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Firmware builds finished. Download the artifacts from this run, or from the release when one was published." >> "$GITHUB_STEP_SUMMARY"
