; StarForge Legacy — RotorHazard node firmware.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; ============================================
; ESP32-C3 SuperMini
; ============================================
[env:esp32-c3-supermini]
board = esp32-c3-devkitm-1
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCONFIG_SINGLE_CORE=1
	-DBOARD_ESP32_C3_SUPERMINI=1
upload_flags =
    --before=default_reset
    --after=hard_reset

; ============================================
; NuclearCounter (ESP32-C3)
; ============================================
[env:nuclearcounter]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_SINGLE_CORE=1
    -DBOARD_NUCLEARCOUNTER=1
upload_flags =
    --before=default_reset
    --after=hard_reset

; ============================================
; Generic ESP32-C3 Dev Module
; ============================================
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_SINGLE_CORE=1
upload_flags =
    --before=default_reset
    --after=hard_reset

; ============================================
; ESP32-C3 Zero
; ============================================
[env:esp32-c3-zero]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_SINGLE_CORE=1
    -DBOARD_ESP32_C3_ZERO=1
upload_flags =
    --before=default_reset
    --after=hard_reset

; ============================================
; ESP32-C6 Dev Module
; ============================================
[env:esp32-c6]
board = esp32-c6-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_SINGLE_CORE=1
upload_flags =
    --before=default_reset
    --after=hard_reset

; ============================================
; ESP32 Dev Module (4MB flash)
; ============================================
[env:esp32dev]
board = esp32dev
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_240=1
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ=240
    -DCONFIG_SPIRAM_SUPPORT=0
    -DBOARD_HAS_PSRAM=0

; ============================================
; ESP32 Dev Module (2MB flash)
; ============================================
[env:esp32dev-2mb]
board = esp32dev
monitor_dtr = 0
monitor_rts = 0
board_build.flash_size = 2MB
board_build.partitions = partitions_2mb.csv
board_build.esp-idf.sdkconfig_path = sdkconfig.2mb
build_flags =
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_240=1
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ=240
    -DCONFIG_SPIRAM_SUPPORT=0
    -DBOARD_HAS_PSRAM=0

; ============================================
; LilyGo T-Energy (ESP32-S3)
; ============================================
[env:esp32-s3-t-energy]
board = esp32-s3-devkitc-1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_T_ENERGY=1

; ============================================
; ESP32-S3 DevKitC-1
; ============================================
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_ESP32_S3_DEVKITC=1

; ============================================
; ESP32-S2 Dev Module
; ============================================
[env:esp32-s2]
board = esp32-s2-saola-1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_SINGLE_CORE=1

; ============================================
; ESP32-C5 DevKitC-1 - native receiver (no RX5808)
; The C5's own 5 GHz radio is the receiver. Connect RotorHazard to the
; board's native USB port (labelled USB, not UART).
; ============================================
[env:esp32-c5]
; Pinned: the C5 receiver calls PHY library functions that are not public
; API (see docs/ESP32_C5.md). Re-test on hardware before moving this.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c5-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_ESP32_C5_DEVKITC=1
    -DSF_SEAT_COUNT=8
upload_flags =
    --before=default_reset
    --after=hard_reset

; ============================================
; Seeed Studio XIAO ESP32-C5 - native receiver (no RX5808)
; Same chip and 8 MB flash as the DevKitC; the u.FL antenna is required for
; usable range. User LED is a plain LED on GPIO27, not an RGB one.
; ============================================
[env:esp32-c5-xiao]
; Pinned with the other C5 targets: the receiver calls PHY library functions
; that are not public API (see docs/ESP32_C5.md).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = seeed_xiao_esp32c5
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_ESP32_C5_XIAO=1
    -DSF_SEAT_COUNT=8
    -DSTATUS_LED_WS2812=0
upload_flags =
    --before=default_reset
    --after=hard_reset

; ============================================
; Waveshare ESP32-C5-Zero - native receiver (no RX5808)
; Uses the onboard antenna; add -DC5_ANT_EXTERNAL=1 for the IPEX connector.
; ============================================
[env:esp32-c5-zero]
; Pinned: the C5 receiver calls PHY library functions that are not public
; API (see docs/ESP32_C5.md). Re-test on hardware before moving this.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c5-devkitc-1
board_build.variant = waveshare_esp32_c5_zero
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_ESP32_C5_ZERO=1
    -DSF_SEAT_COUNT=8
upload_flags =
    --before=default_reset
    --after=hard_reset
